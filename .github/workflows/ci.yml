name: tests

on:
  push:
  pull_request:

# Both the suite and the macro job need pandoc, and the distribution's lags
# behind the >= 3.0 the converter's JSON AST reading needs.  One version
# here rather than two to drift apart.
env:
  PANDOC_VER: "3.6.1"

jobs:
  # Lint first and on a bare runner: ruff needs neither pandoc nor
  # LibreOffice, and a lint that waits for an apt-get and a headless office
  # suite is a lint that reports after the reader has moved on.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pipx install ruff
      - name: ruff check
        run: |
          ruff --version
          ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # libreoffice-writer is what renders the .odt to PDF so the geometry
      # can be measured, and poppler-utils reads the words back out of it.
      # Both are required rather than optional: without them 28 of the
      # tests -- every end-to-end one -- skip, and the run still exits 0.
      # tests/test_tooling.py fails when either is absent, and also checks
      # that this apt line still installs them.
      - name: Install LibreOffice and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer poppler-utils

      # Not from apt: the distribution's pandoc lags, and this converter
      # reads a pandoc JSON AST, which is a versioned interface.  The
      # README asks for >= 3.0; taking the release keeps CI on something a
      # reader can actually install.
      - name: Install pandoc
        run: |
          curl -sSL --retry 3 -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VER}/pandoc-${PANDOC_VER}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: Install the package
        run: python -m pip install --quiet -e ".[dev]"

      # No LINGUEXX2ALLOW_MISSING here, deliberately: the escape hatch is
      # for a person who knows what they are not running, and in CI it
      # would restore the silence the tool check exists to end.
      # test_ci_runs_the_suite_without_the_escape_hatch asserts its absence.
      - name: Run the suite
        run: pytest -q

  # The add-in core: plain ES modules, tested with Node's own runner and no
  # npm install.  Held to the Writer macro's parse and the converter's
  # plan_table() through tests/fixtures/, whose Python half (the goldens
  # being current) is checked by the test job above -- so this needs Node
  # and nothing else.
  addin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: node --test
        run: |
          node --version
          cd addin && node --test core/test/ word/test/

  # The Writer macro, driven inside a real LibreOffice: the .bas that ships
  # is installed into a throwaway profile and invoked through the script
  # provider, so what runs is the file, not a re-implementation of it.  Its
  # own job because it is minutes rather than seconds, and because it needs
  # an interpreter the other two must not use.
  #
  # NOT actions/setup-python: `import uno` comes from the site-packages
  # LibreOffice installs for the SYSTEM python3, and a setup-python
  # interpreter cannot see it.  This job therefore runs whatever python3
  # the runner ships, which is the one python3-uno was built for.
  #
  # pandoc is not optional here even though the macro never calls it: the
  # two checks that take a CONVERTED document apart skip themselves when
  # the converter will not run, and a check that skips in CI is the silent
  # green this workflow exists to prevent.
  macro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LibreOffice, the UNO bridge and poppler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer python3-uno poppler-utils
          python3 -c "import uno; print('uno from', uno.__file__)"

      - name: Install pandoc
        run: |
          curl -sSL --retry 3 -o /tmp/pandoc.deb \
            "https://github.com/jgm/pandoc/releases/download/${PANDOC_VER}/pandoc-${PANDOC_VER}-1-amd64.deb"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      # A cold runner's first soffice start unpacks a profile and is slower
      # than any developer machine; 45s is the local default and not enough
      # here.  See CONNECT_TIMEOUT in the driver.
      - name: Run the macro suite
        env:
          LX_MACRO_TIMEOUT: "180"
        run: python3 tools/run_macro_test.py "$RUNNER_TEMP/macro"
