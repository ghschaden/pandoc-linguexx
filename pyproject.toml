[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandoc-linguexx"
version = "0.1.0"
description = "Convert LaTeX documents with linguexx examples to LibreOffice Writer (.odt), with live number-range fields"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Gerhard Schaden" }]
keywords = ["linguistics", "latex", "pandoc", "odt", "libreoffice", "glosses"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linguexx2odt = "linguexx2odt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
