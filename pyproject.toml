[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pandoc-linguexx"
version = "0.1.0"
description = "Convert LaTeX documents with linguexx examples to LibreOffice Writer (.odt), with live number-range fields"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Gerhard Schaden" }]
keywords = ["linguistics", "latex", "pandoc", "odt", "libreoffice", "glosses"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Markup :: LaTeX",
]
# fontTools reads per-character advances straight out of a font file, which
# is what makes --font more than a label: the column widths are computed
# from real metrics for whatever face the document is set in.  Milliseconds,
# and no LibreOffice, which conversion does not otherwise need.
dependencies = ["fonttools>=4.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
linguexx2odt = "linguexx2odt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The Writer macro is data, not code, and without this it is not shipped at
# all — `pip install` gave you the converter and no macro.
[tool.setuptools.package-data]
"linguexx2odt.writermacro" = ["*.bas"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
